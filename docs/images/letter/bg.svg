<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <radialGradient id="base" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#FDF6EE"/>
      <stop offset="100%" stop-color="#F5E6DA"/>
    </radialGradient>
    <radialGradient id="blush1" cx="30%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#F8C4C4" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#F8C4C4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush2" cx="76%" cy="82%" r="52%">
      <stop offset="0%" stop-color="#F3D9C6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F3D9C6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="55%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#base)"/>
  <rect width="1600" height="1200" fill="url(#blush1)"/>
  <rect width="1600" height="1200" fill="url(#blush2)"/>
  <rect width="1600" height="1200" fill="url(#glow)"/>
  <rect width="1600" height="1200" filter="url(#grain)"/>
</svg>
