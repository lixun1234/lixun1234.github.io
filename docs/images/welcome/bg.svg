<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <!-- 深色底 -->
  <rect width="1600" height="900" fill="#0d0d10"/>
  <!-- 蒙德里安色块 -->
  <rect x="90" y="70" width="420" height="300" fill="#d42020"/>
  <rect x="540" y="70" width="240" height="180" fill="#ffffff" opacity="0.92"/>
  <rect x="1240" y="70" width="280" height="420" fill="#0341ae"/>
  <rect x="810" y="70" width="400" height="240" fill="#f5c400"/>
  <rect x="90" y="400" width="420" height="430" fill="#ffffff" opacity="0.88"/>
  <rect x="540" y="280" width="240" height="330" fill="#111111"/>
  <rect x="1240" y="520" width="280" height="310" fill="#ffffff" opacity="0.9"/>
  <!-- 细网格线 -->
  <g stroke="#0d0d10" stroke-width="16">
    <line x1="540" y1="70" x2="540" y2="830"/>
    <line x1="810" y1="70" x2="810" y2="830"/>
    <line x1="1240" y1="70" x2="1240" y2="830"/>
    <line x1="90" y1="400" x2="1600" y2="400"/>
    <line x1="90" y1="830" x2="1600" y2="830"/>
    <line x1="540" y1="250" x2="1240" y2="250"/>
  </g>
  <!-- 中央留白区（艺术字放在这里） -->
  <rect x="850" y="430" width="660" height="370" fill="#0d0d10"/>
  <line x1="850" y1="430" x2="1510" y2="430" stroke="#ffffff" stroke-width="4" opacity="0.15"/>
  <line x1="850" y1="800" x2="1510" y2="800" stroke="#ffffff" stroke-width="4" opacity="0.15"/>
  <!-- 细节点缀 -->
  <circle cx="140" cy="480" r="26" fill="#0d0d10" stroke="#d42020" stroke-width="8"/>
  <circle cx="1290" cy="200" r="20" fill="#0d0d10" stroke="#f5c400" stroke-width="8"/>
</svg>
